name: CI — Code Quality & Guardrails

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (com cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Instalar dependências (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run -s typecheck || echo "skip:typecheck"

      - name: Lint
        run: pnpm run -s lint || echo "skip:lint"

      - name: Build
        run: pnpm run -s build || echo "skip:build"
