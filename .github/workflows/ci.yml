name: CI — Code Quality & Guardrails

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1+sha512.c753b6c3ad7afa13af388fa6d808035a008e30ea9993f58c6663e2bc5ff21679aa834db094987129aa4d488b86df57f7b634981b2f827cdcacc698cc0cfb88af
          run_install: false

      - name: Setup Node (cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Instalar dependências (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run ts typecheck || echo "skip:typecheck"

      - name: Lint
        run: pnpm run ts lint || echo "skip:lint"

      - name: Build
        run: pnpm run ts build || echo "skip:build"
